<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Affiliate Link Generator for Cocoon Options</title>
    <link rel="stylesheet" href="../dist/assets/main-nZuTNy5X.css">
</head>
<body class="bg-base-100 text-base-content">
    <div class="container mx-auto px-4 py-8 max-w-3xl">
        <h1 class="custom-h1 mb-4">除外するボタン</h1>
        <p class="mb-4">
            チェックをいれるとそのサイトへの導線は表示されなくなります。
        </p>
        <div class="mb-8">
            <div class="max-w-md">
                <div class="form-control">
                    <label class="label cursor-pointer">
                        <span class="label-text">楽天</span>
                        <input type="checkbox" name="exclude" id="rakuten" class="checkbox checkbox-primary" value="rakuten">
                    </label>
                </div>
                <div class="form-control">
                    <label class="label cursor-pointer">
                        <span class="label-text">メルカリ</span>
                        <input type="checkbox" name="exclude" id="mercari" class="checkbox checkbox-primary" value="mercari">
                    </label>
                </div>
                <div class="form-control">
                    <label class="label cursor-pointer">
                        <span class="label-text">Yahoo!</span>
                        <input type="checkbox" name="exclude" id="yahoo" class="checkbox checkbox-primary" value="yahoo">
                    </label>
                </div>
                <div class="form-control">
                    <label class="label cursor-pointer">
                        <span class="label-text">DMM</span>
                        <input type="checkbox" name="exclude" id="dmm" class="checkbox checkbox-primary" value="dmm">
                    </label>
                </div>
            </div>
        </div>

        <h1 class="custom-h1 mb-4 mt-8">除外キーワード</h1>
        <div class="mb-6">
            <div class="max-w-md">
                <div class="mb-4">
                    <label for="keyword" class="label">削除したい文字列を入力してください</label>
                    <div class="join w-full">
                        <input type="text" id="keyword" class="input input-bordered join-item flex-1" placeholder="e.g. 【Amazon.co.jp限定】">
                        <button id="add" class="btn btn-primary join-item">追加</button>
                    </div>
                    <p class="text-sm text-base-content/70 mt-2">
                        <code class="bg-base-200 px-1 rounded">&quot;</code>,
                        <code class="bg-base-200 px-1 rounded">[</code>, 
                        <code class="bg-base-200 px-1 rounded">]</code>など、ショートコード内に含まれると問題が起きるコードは除外しておくことをおすすめします。
                    </p>
                </div>
            </div>
        </div>
        <div class="mb-8">
            <div class="max-w-md">
                <h2 class="custom-h2 mb-2">現在の除外キーワード</h2>
                <ul id="keywordList" class="mt-4"></ul>
            </div>
        </div>
    </div>

    <footer class="footer footer-center p-4 bg-base-200 text-base-content border-t border-base-300">
        <div>
            <p>&copy; 2025 <a href="https://x.com/matsubokkuri" class="link link-hover">@matsubokkuri</a>.</p>
        </div>
    </footer>

    <script type="module" src="../dist/options/options.js"></script>
</body>
</html>
